services:
  model:
    image: 24521569/lfm-optimized:v1
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      # [THAM SỐ CỐ ĐỊNH CỦA BTC]
      - --model=/model
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=1
      
      # [TỐI ƯU CHIỀU DÀI CONTEXT & VRAM H200]
      - --max-model-len=5120
      - --gpu-memory-utilization=0.95
      
      # [HÀNG ĐỢI AN TOÀN TUYỆT ĐỐI CHO CPU 3-CORE]
      - --max-num-seqs=14
      - --max-num-batched-tokens=4096
      
      # [ÉP XUNG BĂNG THÔNG KV CACHE & DTYPE]
      - --quantization=fp8
      - --kv-cache-dtype=fp8_e4m3
      - --dtype=bfloat16
      
      # [TẮT CHUNKED PREFILL - ĐỂ FLASHINFER TỰ XỬ LÝ ATOMIC PREFILL]
      - --enable-prefix-caching
      - --gdn-prefill-backend=flashinfer
      
      # [TRIỆT TIÊU CPU OVERHEAD LOGGING]
      - --disable-log-stats
      - --no-enable-log-requests
      - --trust-remote-code

    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]